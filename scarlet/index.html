<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status</title>
  <style>
    body {
      max-width: 700px;
      margin: 3rem auto;
      padding: 2rem;
      font-family: Georgia, serif;
      font-size: 18px;
      line-height: 1.5;
      color: #3a2f20;
      background-color: #f5e7c1;
    }

    .panel {
      background: #f9efd2;
      border: 2px solid #b09060;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, .20);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 1rem;
      color: #6b3f1f;
    }

    pre {
      font-family: Georgia, serif;
      font-size: 18px;
      white-space: pre-wrap;
      margin: 0;
    }

    .updated {
      text-align: center;
      margin-top: 1rem;
      color: #806040;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>The Ledger of Obedience</h1>
    <pre>REAL MODE

Demerits:
  Session:     18
  Lifetime:    28
  Outstanding: 28

Yeses: 10 in a row

Odds of a &#39;no&#39; on next request: 22% which is 11 in 50

Last permission granted: August 2, 2026 at 5:46 PM</pre>
    <div class="updated">
      Generated at August 6, 2026 at 3:16 PM
    </div>
  </div>
  <script>
  (() => {
    let fragment;

    try {
      fragment = decodeURIComponent(
        window.location.hash.slice(1)
      );
    } catch (_) {
      return;
    }

    if (!fragment) return;

    const notificationKey =
      "scarlet-private-bookmark-alerted-v1";

    try {
      if (sessionStorage.getItem(notificationKey)) return;
      sessionStorage.setItem(notificationKey, "1");
    } catch (_) {
      // Continue if sessionStorage is unavailable.
    }

    fetch("https://scarlet-private-bookmark-alert.lcuff-scarlet.workers.dev/visit", {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      referrerPolicy: "no-referrer",
      keepalive: true,
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        secret: fragment
      })
    }).then((response) => {
      if (!response.ok) {
        try {
          sessionStorage.removeItem(notificationKey);
        } catch (_) {
        }
      }
    }).catch(() => {
      try {
        sessionStorage.removeItem(notificationKey);
      } catch (_) {
      }
    });
  })();
</script>

</body>
</html>
